name: Workflow and API harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest
      - run: python -m workbench.harness --backend rules --out .local/ci-evaluation
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rules-evaluation-python-${{ matrix.python }}
          path: .local/ci-evaluation
