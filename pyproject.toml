[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-workbench"
version = "0.1.0"
description = "Typed local decisions and trace-based evaluations for contract triage and invoice reconciliation"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.16", "fastapi==0.143.3", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "hypothesis==6.170.1", "httpx==0.28.1"]
model = ["decision-tune==1.0.0"]
mlx = ["decision-tune[mlx]==1.0.0"]

[project.scripts]
decision-workbench = "workbench.harness:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
